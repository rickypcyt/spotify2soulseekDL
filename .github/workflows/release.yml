# Publica un GitHub Release con dist/spotify2soulseek-windows.zip (carpeta de la app).
#
# - Push a `main`: lee APP_VERSION de backend/version.py y, si el tag vX.Y.Z
#   todavía no existe, compila y publica el release. Para sacar una versión nueva,
#   sube el número en backend/version.py. Si no cambió, no hace nada.
# - Push de un tag `v*`, o ejecución manual con un tag: publica ese tag.
#
# El exe lleva APP_VERSION igual al tag, así que el self-update compara bien.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a publicar (p.ej. v1.2.3); vacío = leer backend/version.py"
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/version.py)
            tag="v$version"
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "El tag $tag ya existe: no se publica nada. Sube el número en backend/version.py."
            should=false
          else
            should=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag (publicar: $should)"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download slskd for packaging
        run: python -c "from backend.bootstrap import download_slskd; download_slskd()"

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $version = "${env:TAG}" -replace '^v', ''
          Set-Content backend/version.py "APP_VERSION = `"$version`""
          Write-Host "Stamped APP_VERSION = $version"

      - name: Package application (onedir)
        run: python -m PyInstaller packaging/soulseek.spec --noconfirm --clean

      # yt-dlp y deno junto al exe: el PC de destino no descarga nada en el primer uso.
      - name: Bundle yt-dlp and deno
        shell: pwsh
        run: |
          python -c "from backend.youtube_service import _download_ytdlp, _download_deno; _download_ytdlp(); _download_deno()"
          foreach ($tool in @("yt-dlp.exe", "deno.exe")) {
            $source = "vendor/yt-dlp/$tool"
            if (-not (Test-Path $source)) { throw "No se pudo obtener $tool" }
            Copy-Item $source "dist/spotify2soulseek/$tool"
          }

      # El auto-actualizador de la app descarga exactamente este nombre.
      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path dist/spotify2soulseek -DestinationPath dist/spotify2soulseek-windows.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/spotify2soulseek-windows.zip
          generate_release_notes: true
